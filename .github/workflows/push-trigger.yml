name: Artifactory build upon a push

on:
  release:
    types: [published]
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - master
      - develop
      - 1.*
      - MOSIP*
      - release*
      - tf_myanmar
      
  
jobs:
  check-mosip-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify mock-sdk-jpeg-extractor is available
        run: |
          mvn dependency:get \
            -DgroupId=io.mosip.mock.sdk \
            -DartifactId=mock-sdk-jpeg-extractor \
            -Dversion=1.2.0.1-SNAPSHOT \
            -Dclassifier=jar-with-dependencies \
            -Dpackaging=jar \
            -DrepoUrl=https://oss.sonatype.org/content/repositories/snapshots
            
  build-docker-artifactory-server:
    needs: check-mosip-artifact
    strategy:
      matrix:
        include:
          - SERVICE_LOCATION: 'artifacts'
            SERVICE_NAME: 'artifactory-server'
            PLATFORMS: "linux/amd64"
      fail-fast: false
    name: ${{ matrix.SERVICE_NAME }}
    uses: mosip/kattu/.github/workflows/docker-build.yml@master
    with:
      SERVICE_LOCATION: ${{ matrix.SERVICE_LOCATION }}
      SERVICE_NAME: ${{ matrix.SERVICE_NAME }}
      PLATFORMS: ${{ matrix.PLATFORMS }}
    secrets:
      DEV_NAMESPACE_DOCKER_HUB: ${{ secrets.DEV_NAMESPACE_DOCKER_HUB }}
      ACTOR_DOCKER_HUB: ${{ secrets.ACTOR_DOCKER_HUB }}
      RELEASE_DOCKER_HUB: ${{ secrets.RELEASE_DOCKER_HUB }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
